<style>
  :root{ --bg:#0b0a14; --panel:#141122; --ink:#F3F0FB; --ink2:#B9B2D6; --ink3:#8a83a8; --v:#8E44FF; --cy:#3FC7E0; --line:rgba(255,255,255,.08); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:
    radial-gradient(120% 80% at 15% -5%, #1a1330 0%, transparent 55%),
    radial-gradient(120% 80% at 90% 10%, #201736 0%, transparent 52%), var(--bg);
    color:var(--ink);line-height:1.65;min-height:100vh;text-align:center}
  .wrap{max-width:680px;margin:0 auto;padding:96px 22px}
  .dot{width:64px;height:64px;border-radius:18px;margin:0 auto 22px;background:linear-gradient(135deg,var(--v),var(--cy));box-shadow:0 16px 40px -10px var(--v)}
  h1{font-size:clamp(34px,7vw,56px);font-weight:750;letter-spacing:-.03em;
     background:linear-gradient(92deg,#a879ff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:20px;color:var(--ink2);margin:14px 0 40px}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:14px 24px;border-radius:14px;font-weight:600;text-decoration:none;color:#fff;
    background:linear-gradient(92deg,var(--v),var(--cy));box-shadow:0 12px 30px -10px var(--v)}
  a.ghost{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  footer{margin-top:56px;color:var(--ink3);font-size:14px}
  a{color:#b79bff}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <h1>Orakl</h1>
  <div class="tag">Ask anything about the future. A swarm of simulated minds weighs it up — privately, on your device.</div>
  <div class="row">
    <a class="btn" href="privacy.html">Privacy Policy</a>
    <a class="ghost btn" href="mailto:hugomoriceau@icloud.com">Support</a>
  </div>
  <footer>© 2026 Hugo Moriceau · Orakl runs 100% on‑device. No accounts, no tracking, nothing leaves your phone.</footer>
</div>
</body>
</html>
